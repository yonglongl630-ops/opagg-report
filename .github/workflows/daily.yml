name: 舆论蒸馏日报自动生成

on:
  # 说明：日报由 Mac 本地 launchd 定时生成并发布（7 源全量、雪球正常）。
  # GitHub Actions 仅保留手动触发（Run workflow），避免云端 IP 被雪球 WAF 拦截的
  # 降级版本覆盖本地正常版本。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: opagg-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 保留既有日报并拉取历史数据（gh-pages）
        run: |
          rm -rf _gh data_backup
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" _gh || true
          mkdir -p output data/raw data/summary
          if [ -d _gh ]; then
            cp -f _gh/report_*.html output/ 2>/dev/null || true
            tar -xzf _gh/data.tar.gz -C . 2>/dev/null || true
            cp -r data data_backup 2>/dev/null || true
          fi

      - name: 生成当日日报（公共平台实时采集，失败回退缓存）
        env:
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scheduler.py --is-trading-day || { echo "今天非交易日，跳过生成"; exit 0; }
          fi
          python3 scheduler.py --once --force --no-cache --sources guba,xueqiu,ths,jin10,cls,em || {
            echo "实时采集失败，回退缓存重跑";
            rm -rf data/raw data/summary;
            cp -r data_backup/raw data/raw 2>/dev/null || true;
            cp -r data_backup/summary data/summary 2>/dev/null || true;
            python3 scheduler.py --once --force;
          }

      - name: 生成站点首页
        run: python3 src/site.py --dir output

      - name: 打包数据存档（含 up主 素材，供下次生成/缓存）
        run: |
          tar -czf output/data.tar.gz -C . \
            --exclude='data/upmasters/*.xlsx' \
            data/raw data/summary data/upmasters data/state data/trading_calendar.json 2>/dev/null || true

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
