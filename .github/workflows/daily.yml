name: 舆论蒸馏日报自动生成

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；北京时间 = UTC+8
    # 每天 08:00 / 18:00（北京时间）生成日报
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: opagg-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 保留既有日报并拉取历史数据（gh-pages）
        run: |
          rm -rf _gh
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" _gh || true
          mkdir -p output data/raw data/summary
          if [ -d _gh ]; then
            cp -f _gh/report_*.html output/ 2>/dev/null || true
            tar -xzf _gh/data.tar.gz -C . 2>/dev/null || true
          fi

      - name: 生成当日日报
        env:
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: python3 scheduler.py --once

      - name: 生成站点首页
        run: python3 src/site.py --dir output

      - name: 打包数据存档（供下次生成/缓存）
        run: |
          tar -czf output/data.tar.gz -C . data/raw data/summary data/trading_calendar.json 2>/dev/null || true

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
